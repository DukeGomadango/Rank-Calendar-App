<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200, height=630" />
  <title>IRIAM だんごスケジュール</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      font-family: 'Noto Sans JP', sans-serif;
    }
    .root {
      width: 1200px;
      height: 630px;
      position: relative;
      display: flex;
      align-items: stretch;
      overflow: hidden;
    }
    /* 左半分: グラデ + 白文字 */
    .left {
      width: 56%;
      min-width: 560px;
      padding: 56px 48px 56px 56px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: linear-gradient(160deg, #0ea5e9 0%, #38bdf8 35%, #7dd3fc 70%, #bae6fd 100%);
    }
    .sub {
      font-size: 15px;
      font-weight: 700;
      color: rgba(255,255,255,0.95);
      letter-spacing: 0.04em;
      margin-bottom: 24px;
    }
    .title {
      font-size: 40px;
      font-weight: 800;
      line-height: 1.3;
      color: #fff;
      letter-spacing: 0.02em;
      margin-bottom: 40px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.12);
    }
    .title .accent {
      color: #fef3c7;
      text-shadow: 0 0 30px rgba(254,243,199,0.5);
      white-space: nowrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 22px;
      font-weight: 700;
      color: rgba(255,255,255,0.95);
    }
    .brand-icon {
      font-size: 28px;
      line-height: 1;
    }
    /* 右半分: カレンダーUIモック */
    .right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 0;
      position: relative;
    }
    .mock {
      width: 420px;
      transform: rotate(-3deg);
      position: relative;
      left: -20px;
      top: 8px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25), 0 0 0 1px rgba(0,0,0,0.06);
      padding: 20px 22px 22px;
    }
    .mock-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding: 0 2px;
    }
    .mock-month {
      font-size: 15px;
      font-weight: 700;
      color: #27272a;
    }
    .mock-nav {
      font-size: 13px;
      color: #71717a;
    }
    .mock-weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      font-size: 10px;
      font-weight: 600;
      color: #71717a;
      margin-bottom: 8px;
    }
    .mock-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
      text-align: center;
      font-size: 12px;
      font-weight: 500;
    }
    .mock-cell {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      color: #52525b;
      background: #f4f4f5;
    }
    .mock-cell.empty { background: transparent; color: transparent; }
    .mock-cell.today {
      background: #0ea5e9;
      color: #fff;
      font-weight: 700;
    }
    .mock-detail {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed #e4e4e7;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      font-size: 11px;
      color: #3f3f46;
    }
    .mock-detail strong { color: #18181b; }
    .mock-pill {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 9999px;
      font-size: 10px;
      font-weight: 600;
    }
    .mock-pill.blue { background: #dbeafe; color: #1d4ed8; }
    .mock-pill.gray { background: #e4e4e7; color: #52525b; }
  </style>
</head>
<body>
  <div class="root">
    <div class="left">
      <p class="sub">IRIAMライバー向け 非公式スケジュール管理ツール</p>
      <h1 class="title">IRIAMのランク管理を、<span class="accent">ひとつに。</span></h1>
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">🍡</span>
        <span>だんごスケジュール</span>
      </div>
    </div>
    <div class="right">
      <div class="mock">
        <div class="mock-header">
          <span class="mock-month">2025年3月</span>
          <span class="mock-nav">‹ ›</span>
        </div>
        <div class="mock-weekdays">
          <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
        </div>
        <div class="mock-grid">
          <span class="mock-cell empty"></span>
          <span class="mock-cell empty"></span>
          <span class="mock-cell empty"></span>
          <span class="mock-cell empty"></span>
          <span class="mock-cell empty"></span>
          <span class="mock-cell empty"></span>
          <span class="mock-cell">1</span>
          <span class="mock-cell">2</span>
          <span class="mock-cell">3</span>
          <span class="mock-cell">4</span>
          <span class="mock-cell">5</span>
          <span class="mock-cell">6</span>
          <span class="mock-cell">7</span>
          <span class="mock-cell">8</span>
          <span class="mock-cell">9</span>
          <span class="mock-cell">10</span>
          <span class="mock-cell today">11</span>
          <span class="mock-cell">12</span>
          <span class="mock-cell">13</span>
          <span class="mock-cell">14</span>
          <span class="mock-cell">15</span>
          <span class="mock-cell">16</span>
          <span class="mock-cell">17</span>
          <span class="mock-cell">18</span>
          <span class="mock-cell">19</span>
          <span class="mock-cell">20</span>
          <span class="mock-cell">21</span>
          <span class="mock-cell">22</span>
          <span class="mock-cell">23</span>
          <span class="mock-cell">24</span>
          <span class="mock-cell">25</span>
          <span class="mock-cell">26</span>
          <span class="mock-cell">27</span>
          <span class="mock-cell">28</span>
          <span class="mock-cell">29</span>
        </div>
        <div class="mock-detail">
          <span><strong>今日</strong> 目標+2 実績+2</span>
          <span class="mock-pill blue">+4</span>
          <span>スキップパス 使用済</span>
          <span class="mock-pill gray">ボーダー +6</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
